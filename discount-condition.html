<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>!function(){const e=localStorage.getItem('magna-theme');document.documentElement.dataset.theme='light'===e||'dark'===e?e:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}();</script>
<title>Magna Hardware — Category Tiers</title>
<link rel="stylesheet" href="styles.css">
<script src="theme.js" defer></script>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 16V8l4-3 4 3v8M4 16h8M4 16l1.5 3h5L12 16M12 8l4-3 4 3v8h-8" stroke="#151420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="brand-text"><div class="name">Magna Hardware</div><div class="sub">PT MAGNA HARDWARE</div></div>
    </div>
    <nav class="nav">
      <a class="nav-item" href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        Homepage
      </a>
      <a class="nav-item active" href="discount-settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 5 5 19"/><circle cx="7.5" cy="7.5" r="2.5"/><circle cx="16.5" cy="16.5" r="2.5"/></svg>
        Discount
      </a>
      <a class="nav-item" href="sales-commission.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"/><path d="M4 19h16"/><rect x="7" y="12" width="3" height="7"/><rect x="12" y="8" width="3" height="11"/><rect x="17" y="14" width="3" height="5"/></svg>
        Sales Commission
      </a>
    </nav>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch theme" title="Switch theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
    </button>
    <div class="sidebar-footer">
      <div class="avatar">R</div>
      <div><div class="u-name">Rusdi</div><div class="u-role">Sales Manager</div></div>
    </div>
  </aside>

  <main class="main">
    <a class="back-link" href="discount-settings.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      Back to Discount Settings
    </a>

    <div class="page-head">
      <div>
        <h1 id="condition-title">Category Tiers</h1>
        <p>Set the minimum quantity and discount for every tier in this category.</p>
      </div>
      <button class="btn btn-primary" id="add-tier-btn">+ Add Tier</button>
    </div>

    <section class="panel">
      <div class="panel-head"><h3 id="tier-panel-title">Tiers</h3><span class="tag" id="tier-count-tag">0 Tiers</span></div>
      <div class="tier-list" id="tier-list"></div>
    </section>

    <div class="btn-row">
      <button class="btn btn-primary" id="save-btn">Save Category Tiers</button>
      <button class="btn btn-ghost" onclick="window.location.href='discount-settings.html'">Cancel</button>
    </div>
  </main>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const category = params.get('category') || 'Mesin';
  document.getElementById('condition-title').textContent = 'Discount 3 — ' + category;
  document.getElementById('tier-panel-title').textContent = category + ' Tiers';
  document.title = 'Magna Hardware — ' + category + ' Tiers';

  const seeded = {
    'Mesin': [
      { category: 'Mesin', minQty: '5', discount: '' },
      { category: 'Mesin', minQty: '2', discount: '' },
      { category: 'Mesin', minQty: '1', discount: '' },
    ],
  };

  let tiers = (seeded[category] || []).map(t => ({ ...t }));
  if (tiers.length === 0) {
    tiers = [{ category, minQty: '', discount: '' }];
  }

  const tierList = document.getElementById('tier-list');
  const tierCountTag = document.getElementById('tier-count-tag');

  function renderTiers() {
    tierCountTag.textContent = tiers.length + ' Tiers';
    tierList.innerHTML = tiers.map((t, i) => `
      <div class="tier-card">
        <div class="tier-card-head">
          <div class="t-name"><span class="tier-badge">${i + 1}</span> Tier ${i + 1}</div>
          ${tiers.length > 1 ? `<button class="row-remove" data-i="${i}">&times;</button>` : ''}
        </div>
        <div class="tier-fields">
          <div class="field">
            <label>Category</label>
            <select data-i="${i}" data-key="category">
              <option value="Mesin" ${t.category === 'Mesin' ? 'selected' : ''}>Mesin</option>
              <option value="Perkakas Tangan" ${t.category === 'Perkakas Tangan' ? 'selected' : ''}>Perkakas Tangan</option>
              <option value="Safety Equipment" ${t.category === 'Safety Equipment' ? 'selected' : ''}>Safety Equipment</option>
            </select>
          </div>
          <div class="field">
            <label>Minimum Quantity</label>
            <input type="number" min="1" data-i="${i}" data-key="minQty" value="${t.minQty}" placeholder="e.g. 5">
          </div>
          <div class="field">
            <label>Discount</label>
            <input type="text" data-i="${i}" data-key="discount" value="${t.discount}" placeholder="e.g. 5%">
          </div>
        </div>
      </div>
    `).join('');

    tierList.querySelectorAll('input, select').forEach(input => {
      input.addEventListener('input', () => {
        tiers[Number(input.dataset.i)][input.dataset.key] = input.value;
      });
      input.addEventListener('change', () => {
        tiers[Number(input.dataset.i)][input.dataset.key] = input.value;
      });
    });
    tierList.querySelectorAll('.row-remove').forEach(btn => {
      btn.addEventListener('click', () => {
        tiers.splice(Number(btn.dataset.i), 1);
        renderTiers();
      });
    });
  }

  document.getElementById('add-tier-btn').addEventListener('click', () => {
    tiers.push({ category, minQty: '', discount: '' });
    renderTiers();
  });

  document.getElementById('save-btn').addEventListener('click', () => {
    // Placeholder for wiring to the backend (e.g. POST /api/discount-conditions/{id}/tiers)
    alert('Category ' + category + ' tersimpan dengan ' + tiers.length + ' tier.');
  });

  renderTiers();
</script>
</body>
</html>
